[mcp_servers.easyeda]
command = "node"
args = ["C:/path/to/easyeda-mcp/dist/server.js"]

[mcp_servers.easyeda.env]
EASYEDA_STATE_DIR = "C:/path/to/easyeda-mcp/.easyeda-mcp"
AUTO_SPAWN_BRIDGE = "false"
EASYEDA_COMPAT = "0"
EASYEDA_EXPERIMENTAL_ROUTING = "0"
EASYEDA_ALLOW_RAW_CODE = "0"
EASYEDA_TOOL_MODE = "full"
